name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx ng build --configuration production

  deploy:
    name: Desplegar en ec2-apps
    # Solo al fusionar en main (no en pull requests) y si los tests pasaron.
    if: github.event_name == 'push'
    needs: build
    uses: ManuelCaceresDuocUC/barriodigital-infra/.github/workflows/deploy-service.yml@main
    with:
      directorio: frontend-barriodigital
      servicio: frontend-barriodigital
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
